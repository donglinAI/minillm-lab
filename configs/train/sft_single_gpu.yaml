# 单卡 SFT（指令微调）配置
# 路径相对于本文件所在目录（configs/train/）
model_config: "../model/tiny.yaml"
data_config: "../data/sft.yaml"

output_dir: "./output/sft_tiny"

# 优化器
optimizer:
  name: "adamw"
  lr: 1.0e-5        # ★ SFT 用小学习率: 只微调、防灾难性遗忘（预训练 1e-3 级）
  betas: [0.9, 0.95]
  weight_decay: 0.0 # ★ SFT 不加正则: 目标只是适配指令, 不需要约束权重
  eps: 1.0e-8

# 学习率调度
lr_scheduler:
  name: "cosine"
  warmup_steps: 20
  max_steps: 500
  min_lr_ratio: 0.1           # 最低 lr = max_lr * 0.1

# 训练
batch_size: 8
grad_accum_steps: 1
grad_clip: 1.0
max_steps: 500
log_interval: 10
save_interval: 100

# 数据（覆盖 data/sft.yaml 的同名字段）
seq_len: 512
mode: "pad"
max_train_samples: 10000

# 分布式（单卡阶段全部关闭）
distributed:
  backend: "nccl"
  data_parallel_size: 1
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  zero_stage: 0

seed: 42
