# 单卡预训练配置
# 路径相对于本文件所在目录（configs/train/）
model_config: "../model/tiny.yaml"
data_config: "../data/pretrain_zh.yaml"

output_dir: "./output/pretrain_tiny"

# 优化器
optimizer:
  name: "adamw"
  lr: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  eps: 1.0e-8

# 学习率调度
lr_scheduler:
  name: "cosine"
  warmup_steps: 200
  max_steps: 5000
  min_lr_ratio: 0.1           # 最低 lr = max_lr * 0.1

# 训练
batch_size: 32
grad_accum_steps: 4           # 等效 batch = 32 * 4 = 128
grad_clip: 1.0
max_steps: 5000
log_interval: 10
eval_interval: 500
save_interval: 1000

# 分布式（单卡阶段全部关闭）
distributed:
  backend: "nccl"
  data_parallel_size: 1
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  zero_stage: 0               # 0=关闭, 1=优化器状态切分, 2=梯度切分, 3=参数切分

# 日志
tensorboard_dir: "./output/pretrain_tiny/tb"
seed: 42
