# 多卡 DDP 预训练配置（真实 DDP：torchrun 启动 N 进程，每进程一张卡）
# 用法: torchrun --nproc_per_node=N -m minillm.pretrain.train --config configs/train/pretrain_ddp.yaml
# 路径相对于本文件所在目录（configs/train/）
model_config: "../model/tiny.yaml"
data_config: "../data/pretrain_zh.yaml"

output_dir: "./output/pretrain_ddp"

# 优化器
optimizer:
  name: "adamw"
  lr: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  eps: 1.0e-8

# 学习率调度
lr_scheduler:
  name: "cosine"
  warmup_steps: 200
  max_steps: 5000
  min_lr_ratio: 0.1

# 训练（batch_size 是"每张卡"的 micro-batch）
# 总等效 batch = batch_size × 卡数 × grad_accum_steps
batch_size: 16
grad_accum_steps: 4
grad_clip: 1.0
max_steps: 5000
log_interval: 10
eval_interval: 500
save_interval: 1000

# 分布式（真实 DDP：进程数由 torchrun --nproc_per_node 决定）
distributed:
  backend: "nccl"
  data_parallel_size: 1        # 占位：真实卡数由 torchrun 注入 WORLD_SIZE
  tensor_parallel_size: 1      # TP 未接入真实训练（engine.py 为模拟器）
  pipeline_parallel_size: 1    # PP 未接入真实训练（schedules.py 为模拟器）
  zero_stage: 0                # 0=关闭（ZeRO 为模拟验证，真实训练用 DDP 梯度平均）

seed: 42
